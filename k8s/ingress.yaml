apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vendr-ingress
  namespace: vendr
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: admin.vendr.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vendr-admin
                port:
                  number: 3001
    - host: api.vendr.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vendr-api
                port:
                  number: 4000
    - host: vendr.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vendr-storefront
                port:
                  number: 3000
