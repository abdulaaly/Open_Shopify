apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vendr-api-hpa
  namespace: vendr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vendr-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vendr-storefront-hpa
  namespace: vendr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vendr-storefront
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
