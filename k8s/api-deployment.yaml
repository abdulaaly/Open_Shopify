apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendr-api
  namespace: vendr
  labels:
    app: vendr-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vendr-api
  template:
    metadata:
      labels:
        app: vendr-api
    spec:
      containers:
        - name: api
          image: ghcr.io/abdulaaly/vendr-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: vendr-config
          env:
            - name: DATABASE_URL
              value: "postgresql://vendr:vendr_secure_password_2026@vendr-postgres:5432/vendr_commerce?schema=public"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vendr-api
  namespace: vendr
spec:
  selector:
    app: vendr-api
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
