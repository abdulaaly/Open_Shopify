apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-shopify-api
  namespace: open-shopify
spec:
  replicas: 3
  selector:
    matchLabels:
      app: open-shopify-api
  template:
    metadata:
      labels:
        app: open-shopify-api
    spec:
      containers:
        - name: api
          image: ghcr.io/abdulaaly/open-shopify-api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: open-shopify-config
---
apiVersion: v1
kind: Service
metadata:
  name: open-shopify-api
  namespace: open-shopify
spec:
  selector:
    app: open-shopify-api
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
