<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#090D16" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#05080E" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="emeraldBanner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#10B981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGlow)" />
  
  <!-- Subtle Architectural Grid Pattern -->
  <g stroke="#334155" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Center Logo Emblem -->
  <g transform="translate(540, 50)" filter="url(#bannerGlow)">
    <rect x="0" y="0" width="120" height="120" rx="30" fill="#090D16" stroke="#10B981" stroke-width="2.5" />
    <path d="M26 36 L48 36 L60 76 L72 36 L94 36 L72 96 L48 96 Z" fill="url(#emeraldBanner)" />
    <path d="M60 48 L70 68 L60 88 L50 68 Z" fill="#6EE7B7" opacity="0.9" />
  </g>

  <!-- Typography -->
  <text x="600" y="225" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="6" fill="#FFFFFF">VENDR</text>
  <text x="600" y="260" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#10B981">OPEN-SOURCE ENTERPRISE COMMERCE ENGINE</text>
  <text x="600" y="295" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">100% Feature &amp; UX Parity with Shopify &#x2022; Zero Transaction Fees &#x2022; Sub-50ms Edge &#x2022; WASM Functions &#x2022; Unified Omni-App</text>

  <!-- Feature Pillar Badges -->
  <g transform="translate(180, 335)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="190" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="95" y="26" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">&#x26A1; Sub-50ms Storefront</text>

    <!-- Badge 2 -->
    <rect x="215" y="0" width="190" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="310" y="26" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">&#x1F4B8; Zero Platform Fees</text>

    <!-- Badge 3 -->
    <rect x="430" y="0" width="190" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="525" y="26" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">&#x2699;&#xFE0F; Rust/WASM Sandbox</text>

    <!-- Badge 4 -->
    <rect x="645" y="0" width="190" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="740" y="26" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">&#x1F4F1; Unified Omni-App (Flutter)</text>
  </g>
</svg>
